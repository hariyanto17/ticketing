appId: com.planetcinema.printer-agent
productName: Planet Cinema Printer Agent
directories:
  app: .
  output: dist-installers
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  uninstallDisplayName: Planet Cinema Printer Agent
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Planet Cinema Printer Agent
files:
  - dist/**
  - package.json
  - "node_modules/**/*"
extraMetadata:
  main: dist/main/main.js
